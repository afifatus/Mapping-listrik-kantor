<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Single Line Diagram Panel</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="crumb">
            <button id="back" hidden>← Kembali</button>
            <span id="crumb">Utama</span>
        </div>
        <div class="search">
            <input id="q" placeholder="Cari komponen…" autocomplete="off">
            <ul id="res" hidden></ul>
        </div>
    </header>

    <main id="stage">
        <div id="canvas">
            <svg id="wires"></svg>
            <div id="view"></div>
        </div>
    </main>

    <footer class="legend">
        <span><i class="l pw"></i>Daya aktif</span>
        <span><i class="l sb"></i>Standby</span>
        <span><i class="l ct"></i>Kontrol AMF</span>
        <span><i class="l r"></i>Fasa R</span>
        <span><i class="l s"></i>Fasa S</span>
        <span><i class="l t"></i>Fasa T</span>
        <span class="hint">Klik komponen untuk menyorot jalur · klik kartu "Buka isi" untuk masuk lebih dalam</span>
    </footer>

    <div id="modal" hidden>
        <div class="box"><button id="close">✕</button>
            <div id="mbody"></div>
        </div>
    </div>
    <div id="zoom" hidden><img alt=""></div>

    <script src="script.js"></script>
</body>

</html>
